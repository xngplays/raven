<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Well Soon, Raven!</title>
    <style>
        body {
            background-color: #ffc0cb;
            text-align: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            color: #ff69b4;
        }
        .message {
            font-size: 2em;
            margin-top: 20vh;
            animation: bounce 1.5s infinite alternate;
        }
        .kitty {
            width: 150px;
            margin-top: 20px;
            animation: spin 3s linear infinite;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1 class="message">I hope you feel better, Raven!! 💕</h1>
    <img class="kitty" src="https://i.imgur.com/8yPM8fD.png" alt="Hello Kitty">
</body>
</html>
